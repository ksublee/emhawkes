name: R CMD check

on:
  push:
    branches: [main, 'codex/cran-*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }} / ${{ matrix.config.check || 'as-cran' }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: release}
          - {os: windows-latest, r: devel}
          - {os: windows-latest, r: '4.0.0'}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: devel, check: default}
          - {os: windows-latest, r: release, check: default}
    env:
      R_KEEP_PKG_SOURCE: yes
      _R_CHECK_SUGGESTS_ONLY_: ${{ matrix.config.check == 'default' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: ${{ matrix.config.r != '4.0.0' }}
          cran: ${{ matrix.config.r == '4.0.0' && 'https://packagemanager.posit.co/cran/2024-08-01' || '' }}
      - name: Verify minimum R version
        if: matrix.config.r == '4.0.0'
        shell: Rscript {0}
        run: |
          stopifnot(getRversion() == numeric_version("4.0.0"))
          # Current check-tool dependencies no longer all support R 4.0.
          # Pin only this minimum-version job; current-R jobs remain current.
          repository <- "https://packagemanager.posit.co/cran/2024-08-01"
          cat("\n", paste0("options(repos = c(CRAN = ", deparse(repository), "))"), "\n",
              file = path.expand("~/.Rprofile"), append = TRUE, sep = "")
          cat("RSPM=", repository, "\nRENV_CONFIG_REPOS_OVERRIDE=", repository, "\n",
              file = Sys.getenv("GITHUB_ENV"), append = TRUE, sep = "")
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - name: Expose installed packages through the site library
        if: matrix.config.check == 'default'
        shell: Rscript {0}
        run: |
          stopifnot(length(find.package("maxLik", quiet = TRUE)) == 1L)
          paths <- paste(.libPaths(), collapse = .Platform$path.sep)
          cat("R_LIBS_SITE=", paths, "\n", file = Sys.getenv("GITHUB_ENV"),
              append = TRUE, sep = "")
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: ${{ matrix.config.check == 'default' && 'c("--no-manual", "--run-donttest")' || 'c("--no-manual", "--as-cran", "--run-donttest")' }}
          error-on: '"warning"'
          upload-results: 'true'
          artifact-name: check-${{ matrix.config.os }}-r${{ matrix.config.r }}-${{ matrix.config.check || 'as-cran' }}
      - name: Record release source provenance
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: |
          cd check
          set -- emhawkes_*.tar.gz
          test "$#" -eq 1
          test -f "$1"
          sha256sum "$1" > SHA256SUMS
          cat SHA256SUMS
          git -C .. rev-parse HEAD > SOURCE-COMMIT
          Rscript -e 'writeLines(c(R.version.string, capture.output(sessionInfo())), "BUILD-SESSION.txt")'
      - name: Retain release source package
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cran-source-package
          path: |
            check/emhawkes_*.tar.gz
            check/SHA256SUMS
            check/SOURCE-COMMIT
            check/BUILD-SESSION.txt
            check/emhawkes.Rcheck/00check.log
          if-no-files-found: error
          retention-days: 30

  stats-only:
    name: Stats optimizer without maxLik
    runs-on: ubuntu-latest
    env:
      EMHAWKES_TEST_REQUIRE_NO_MAXLIK: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          dependencies: '"hard"'
      - name: Install with hard dependencies only
        run: R CMD INSTALL --preclean .
      - name: Require genuine absence and replay the saved stats fit
        run: Rscript --vanilla tests/stats-isolated-session.R
