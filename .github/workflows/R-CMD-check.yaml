name: R CMD check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} / R ${{ matrix.config.r }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: windows-latest, r: release}
          - {os: windows-latest, r: '4.0.0'}
          - {os: macos-latest, r: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: devel}
          - {os: ubuntu-latest, r: oldrel-1}
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          use-public-rspm: true
      - name: Verify minimum R version
        if: matrix.config.r == '4.0.0'
        run: stopifnot(getRversion() == numeric_version("4.0.0"))
        shell: Rscript {0}
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check
      - uses: r-lib/actions/check-r-package@v2
        with:
          args: 'c("--no-manual", "--as-cran", "--run-donttest")'
          error-on: '"warning"'
          upload-results: 'true'
      - name: Record release source provenance
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        shell: bash
        run: |
          cd check
          set -- emhawkes_*.tar.gz
          test "$#" -eq 1
          test -f "$1"
          sha256sum "$1" > SHA256SUMS
          cat SHA256SUMS
          git -C .. rev-parse HEAD > SOURCE-COMMIT
          Rscript -e 'writeLines(c(R.version.string, capture.output(sessionInfo())), "BUILD-SESSION.txt")'
      - name: Retain release source package
        if: matrix.config.os == 'ubuntu-latest' && matrix.config.r == 'release'
        uses: actions/upload-artifact@v4
        with:
          name: cran-source-package
          path: |
            check/emhawkes_*.tar.gz
            check/SHA256SUMS
            check/SOURCE-COMMIT
            check/BUILD-SESSION.txt
            check/emhawkes.Rcheck/00check.log
          if-no-files-found: error
          retention-days: 30
